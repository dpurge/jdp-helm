---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "grafana.fullname" . }}-data"
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "grafana.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "grafana.fullname" . }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ include "grafana.fullname" . }}"
  template:
    metadata:
      labels:
        app: "{{ include "grafana.fullname" . }}"
    spec:
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image }}"
        volumeMounts:
          - name: "{{ include "grafana.fullname" . }}-data"
            mountPath: /var/lib/grafana
        ports:
        - containerPort: 3000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 256Mi
      volumes:
        - name: "{{ include "grafana.fullname" . }}-data"
          persistentVolumeClaim:
            claimName: "{{ include "grafana.fullname" . }}-data"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 472

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "grafana.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: "{{ include "grafana.fullname" . }}"
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "grafana.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.grafana.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "grafana.fullname" . }}"
          port: 3000
