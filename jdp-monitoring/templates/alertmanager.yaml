---
kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ include "alertmanager.fullname" . }}"
  namespace: {{ .Release.Namespace }}
data:
  config.yml: |-
    global:
    route:
      receiver: example-on-call
      group_wait: 15m
      repeat_interval: 24h
      routes: []

    receivers:
    - name: example-on-call
      webhook_configs:
        - url: "https://api.example.com/triggers/YOUR-TRIGGER-ID/alert"
          http_config:
            follow_redirects: false
            authorization:
              credentials: "EXAMPLE-ON-CALL-API-KEY"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "alertmanager.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ include "alertmanager.fullname" . }}"
  template:
    metadata:
      name: "{{ include "alertmanager.fullname" . }}"
      labels:
        app: "{{ include "alertmanager.fullname" . }}"
    spec:
      containers:
      - name: alertmanager
        image: "{{ .Values.alertmanager.image }}"
        args:
          - "--config.file=/etc/alertmanager/config.yml"
          - "--storage.path=/alertmanager"
        ports:
          - containerPort: 9093
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 32Mi
        volumeMounts:
        - name: "{{ include "alertmanager.fullname" . }}-config"
          mountPath: /etc/alertmanager
        - name: "{{ include "alertmanager.fullname" . }}-data"
          mountPath: /alertmanager
      volumes:
      - name: "{{ include "alertmanager.fullname" . }}-config"
        configMap:
          name: "{{ include "alertmanager.fullname" . }}"
      - name: "{{ include "alertmanager.fullname" . }}-data"
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "alertmanager.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: "{{ include "alertmanager.fullname" . }}"
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "alertmanager.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.alertmanager.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "alertmanager.fullname" . }}"
          port: 9093
