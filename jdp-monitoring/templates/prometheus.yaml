---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "prometheus.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    name: "{{ include "prometheus.fullname" . }}"
data:
  prometheus.rules: |-
    groups:
      - name: Node Memory is too high
        rules:
          - alert: High Node Memory
            expr: container_memory_working_set_bytes > 7.8e9
            for: 15m
  prometheus.yml: |-
    global:
      scrape_interval: 15m
      evaluation_interval: 15m
    rule_files:
      - /etc/prometheus/prometheus.rules
    alerting:
      alertmanagers:
        - scheme: http
          static_configs:
            - targets:
              - "{{ include "alertmanager.fullname" . }}:9093"
    scrape_configs:
      - job_name: 'node-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [__name__,id]
            regex: container_memory_working_set_bytes;/$
            action: keep

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "prometheus.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "prometheus.fullname" . }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ include "prometheus.fullname" . }}"
  template:
    metadata:
      labels:
        app: "{{ include "prometheus.fullname" . }}"
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image }}"
          args:
            - "--storage.tsdb.retention.time=24h"
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
            - "--web.enable-lifecycle"
            - "--web.enable-remote-write-receiver"
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
            - name: prometheus-data
              mountPath: /prometheus/
      volumes:
        - name: prometheus-config
          configMap:
            defaultMode: 420
            name: "{{ include "prometheus.fullname" . }}"
        - name: prometheus-data
          emptyDir:
            sizeLimit: 50Mi

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "prometheus.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: "{{ include "prometheus.fullname" . }}"
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ include "prometheus.fullname" . }}"
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ include "prometheus.fullname" . }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ include "prometheus.fullname" . }}"
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "prometheus.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.prometheus.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "prometheus.fullname" . }}"
          port: 9090
