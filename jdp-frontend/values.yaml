pgadmin:
  image: dpage/pgadmin4:9.11.0
  hostname: pgadmin.home.arpa
  database:
    host: jdp-data-postgres.data.svc.cluster.local
    port: 5432

planka:
  image: ghcr.io/plankanban/planka:2.0.0-rc.4
  hostname: planka.home.arpa
  database:
    name: planka
    host: jdp-data-postgres.data.svc.cluster.local
    port: 5432

phraseforge:
  image: ghcr.io/dpurge/phraseforge:2026.9.8
  hostname: phraseforge.home.arpa
  bindAddr: "0.0.0.0:8090"
  # Postgres host/port/database come from the OpenBao-backed Secret (see
  # jdp-backend/README's OpenBao key table), not from values.yaml.
  providers:
    ollama:
      baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
  # Every purpose's provider/model/numCtx/timeoutSeconds/prompt is declared
  # explicitly here.
  transcription:
    provider: ollama
    model: gemma4:12b
    timeoutSeconds: 120
    prompt: |
      Create a romanized transcription for the source language content.
      Return only the transcription, preserving line breaks and structure.
      Do not add explanations.
  translation:
    provider: ollama
    model: gemma4:12b
    timeoutSeconds: 120
    prompt: |
      Translate the source language content to the target language.
      Return only the translation, preserving line breaks and structure.
      Do not add explanations.
  title:
    provider: ollama
    model: gemma4:12b
    numCtx: 8192
    timeoutSeconds: 120
    prompt: |
      You write a short, specific title for the given text.
      Respond with only the title text on a single line — no quotes, no punctuation at the end, no preamble.
  processText:
    provider: ollama
    model: gemma4:12b
    numCtx: 8192
    timeoutSeconds: 300
    prompt: |
      You reformat raw extracted text into clean Markdown prose suitable as a language-learning reading text.
      Remove navigation menus, ads, boilerplate, and unrelated content.
      Preserve the actual article/passage content and its paragraph structure.
      Do not translate or summarize.
      Respond with only the cleaned Markdown.
  processDialog:
    provider: ollama
    model: gemma4:12b
    numCtx: 8192
    timeoutSeconds: 300
    prompt: |
      You reformat raw extracted text into a clean dialog transcript in Markdown.
      Identify distinct speakers/turns and format each turn on its own line.
      Remove navigation, ads, and unrelated content.
      Respond with only the cleaned dialog content.
  generateVocabulary:
    provider: ollama
    model: gemma4:12b
    numCtx: 8192
    timeoutSeconds: 600
    prompt: |
      You extract vocabulary and grammar items from the given text for a language learner.
      Respond ONLY with one item per line, in this exact format:
      phrase {grammar} [transcription] = translation
      where:
      - {grammar} is a short grammar tag (e.g. N for noun, V for verb, J for adjective, A for adverb)
      - [transcription] is a romanized reading (e.g. pinyin, arabic/hebrew pronunciation)
      - translation is the item's translation; lowercase unless orthography requires capitalization; meanings separated with '; '
      - each of {grammar}, [transcription], and = translation is optional and must be omitted entirely (not left as empty brackets) when not applicable.
      Do not add commentary, a preamble, numbering, or code fences — only the item lines themselves.
  generateModels:
    provider: ollama
    model: gemma4:12b
    numCtx: 8192
    timeoutSeconds: 600
    prompt: |
      You extract short grammar/sentence-pattern models from the given text for a language learner.
      Respond ONLY with one item per line, in this exact format:
      phrase [transcription] = translation
      where:
      - [transcription] is a romanized reading
      - = translation is the item's translation
      - each of [transcription] and = translation is optional and must be omitted entirely (not left as empty brackets) when not applicable.
      Do not add commentary, a preamble, numbering, or code fences — only the item lines themselves.
      Build progresively longer coherent phrases illustrating patterns used in the text.

knowledge:
  image: ghcr.io/dpurge/knowledge:2026.9.7
  hostname: knowledge.home.arpa
  # Postgres host/port/database and the Qdrant URL come from the
  # OpenBao-backed Secret (see jdp-backend/README's OpenBao key table).
  embeddings:
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: bge-m3
    # bge-m3 produces 1024-dim dense embeddings
    dimension: 1024
  chat:
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: gemma4:12b
    # gemma4:12b's Ollama runtime default context is 4096 tokens, far below
    # its trained max. Full retrieved documents go straight into the
    # prompt, so the larger window matters (ported from k8s-lab).
    numCtx: 8192
  generate:
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: gemma4:12b
  translate:
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: gemma4:12b
