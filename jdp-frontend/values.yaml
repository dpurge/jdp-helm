pgadmin:
  image: dpage/pgadmin4:9.11.0
  hostname: pgadmin.home.arpa
  database:
    host: jdp-data-postgres.data.svc.cluster.local
    port: 5432

phraseforge:
  image: ghcr.io/dpurge/phraseforge:2026.9.4
  hostname: phraseforge.home.arpa
  database:
    name: phraseforge
    host: jdp-data-postgres.data.svc.cluster.local
    port: 5432
  llm:
    provider: ollama
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: rinex20/translategemma3:12b

planka:
  image: ghcr.io/plankanban/planka:2.0.0-rc.4
  hostname: planka.home.arpa
  database:
    name: planka
    host: jdp-data-postgres.data.svc.cluster.local
    port: 5432

knowledge:
  image: ghcr.io/dpurge/knowledge:2026.9.2
  hostname: knowledge.home.arpa
  database:
    name: knowledge
    host: jdp-data-postgres.data.svc.cluster.local
    port: 5432
  qdrant:
    url: http://jdp-data-qdrant.data.svc.cluster.local:6333
  embeddings:
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: bge-m3
    # bge-m3 produces 1024-dim dense embeddings — verified directly against
    # the running Ollama instance (POST /api/embeddings), not assumed.
    dimension: 1024
  chat:
    baseUrl: http://jdp-backend-ollama.backend.svc.cluster.local:11434
    model: llama3-chatqa:8b
