---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: jdp-backend-secrets
    kind: ClusterSecretStore
  target:
    name: "{{ include "knowledge.fullname" . }}"
    creationPolicy: Owner
  data:
  - secretKey: PGUSER
    remoteRef:
      key: knowledge
      property: postgres-username
  - secretKey: PGPASSWORD
    remoteRef:
      key: knowledge
      property: postgres-password
  - secretKey: PGDATABASE
    remoteRef:
      key: knowledge
      property: postgres-database

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "knowledge.fullname" . }}-migrate"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: migration
  annotations:
    # Run as a hook so each release gets a fresh Job (Job spec.template is
    # immutable, so a plain manifest can never be upgraded in place).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # before-hook-creation: delete the previous release's Job so the new one
    # can be created even if it's still around (e.g. it failed or ttl hasn't
    # expired yet). hook-succeeded: clean up after a successful migration.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: "{{ include "knowledge.fullname" . }}"
        component: migration
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: "{{ .Values.knowledge.image }}"
        imagePullPolicy: IfNotPresent
        command: ["/knowledge", "migrate"]
        env:
        - name: PGHOST
          value: {{ .Values.knowledge.database.host | quote }}
        - name: PGPORT
          value: {{ .Values.knowledge.database.port | quote }}
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPASSWORD
        - name: QDRANT_URL
          value: {{ .Values.knowledge.qdrant.url | quote }}
        - name: EMBEDDINGS_PROVIDER
          value: ollama
        - name: EMBEDDINGS_BASE_URL
          value: {{ .Values.knowledge.embeddings.baseUrl | quote }}
        - name: EMBEDDINGS_MODEL
          value: {{ .Values.knowledge.embeddings.model | quote }}
        - name: EMBEDDINGS_DIMENSION
          value: {{ .Values.knowledge.embeddings.dimension | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app: "{{ include "knowledge.fullname" . }}"
    component: deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: knowledge
        image: "{{ .Values.knowledge.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8300
        env:
        - name: PGHOST
          value: {{ .Values.knowledge.database.host | quote }}
        - name: PGPORT
          value: {{ .Values.knowledge.database.port | quote }}
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPASSWORD
        - name: QDRANT_URL
          value: {{ .Values.knowledge.qdrant.url | quote }}
        - name: EMBEDDINGS_PROVIDER
          value: ollama
        - name: EMBEDDINGS_BASE_URL
          value: {{ .Values.knowledge.embeddings.baseUrl | quote }}
        - name: EMBEDDINGS_MODEL
          value: {{ .Values.knowledge.embeddings.model | quote }}
        - name: EMBEDDINGS_DIMENSION
          value: {{ .Values.knowledge.embeddings.dimension | quote }}
        - name: CHAT_PROVIDER
          value: ollama
        - name: CHAT_BASE_URL
          value: {{ .Values.knowledge.chat.baseUrl | quote }}
        - name: CHAT_MODEL
          value: {{ .Values.knowledge.chat.model | quote }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: service
spec:
  selector:
    app: "{{ include "knowledge.fullname" . }}"
    component: deployment
  ports:
  - name: http
    port: 80
    targetPort: 8300
  type: ClusterIP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.knowledge.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "knowledge.fullname" . }}"
          port: 80
