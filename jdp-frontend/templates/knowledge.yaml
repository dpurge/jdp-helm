---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: jdp-backend-secrets
    kind: ClusterSecretStore
  target:
    name: "{{ include "knowledge.fullname" . }}"
    creationPolicy: Owner
  data:
  - secretKey: PGHOST
    remoteRef:
      key: knowledge
      property: postgres-host
  - secretKey: PGPORT
    remoteRef:
      key: knowledge
      property: postgres-port
  - secretKey: PGDATABASE
    remoteRef:
      key: knowledge
      property: postgres-database
  - secretKey: PGUSER
    remoteRef:
      key: knowledge
      property: postgres-username
  - secretKey: PGPASSWORD
    remoteRef:
      key: knowledge
      property: postgres-password
  - secretKey: QDRANT_URL
    remoteRef:
      key: knowledge
      property: qdrant-url
{{- if .Values.knowledge.secrets.openrouter_api_key }}
  - secretKey: OPENROUTER_API_KEY
    remoteRef:
      key: knowledge
      property: openrouter-api-key
{{- end }}
{{- if .Values.knowledge.secrets.anthropic_api_key }}
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: knowledge
      property: anthropic-api-key
{{- end }}

---
# knowledge reads qdrant/embeddings/chat/generate_title/generate_summary/
# translate/knowledge_language/llm_calls from the mounted config.yaml and the
# providers and models from the mounted models.yaml (KNOWLEDGE_MODELS_FILE,
# default /etc/knowledge/models.yaml), not env vars (see knowledge's
# internal/config package; every key is snake_case and an old camelCase key stops
# the app at startup). Postgres connection details, QDRANT_URL and the provider
# API keys come from the environment instead (see the Secret above), so this
# ConfigMap is never needed by the migrate Job below and stays a normal,
# Helm-tracked resource. Prompts are the image's defaults.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: configmap
data:
  config.yaml: |
    qdrant:
      collection: {{ .Values.knowledge.qdrant.collection | quote }}
      search_min_score: {{ .Values.knowledge.qdrant.search_min_score }}
    embeddings:
      embedding_space: {{ .Values.knowledge.embeddings.embedding_space | quote }}
      dimension: {{ .Values.knowledge.embeddings.dimension }}
    chat:
      model_tags: {{ .Values.knowledge.chat.model_tags | toJson }}
      num_ctx: {{ .Values.knowledge.chat.num_ctx }}
      timeout_seconds: {{ .Values.knowledge.chat.timeout_seconds }}
    generate_title:
      model_tags: {{ .Values.knowledge.generate_title.model_tags | toJson }}
      timeout_seconds: {{ .Values.knowledge.generate_title.timeout_seconds }}
    generate_summary:
      model_tags: {{ .Values.knowledge.generate_summary.model_tags | toJson }}
      timeout_seconds: {{ .Values.knowledge.generate_summary.timeout_seconds }}
    knowledge_language: {{ .Values.knowledge.knowledge_language | quote }}
    translate:
      model_tags: {{ .Values.knowledge.translate.model_tags | toJson }}
      timeout_seconds: {{ .Values.knowledge.translate.timeout_seconds }}
    llm_calls:
      retention_days: {{ .Values.knowledge.llm_calls.retention_days }}
{{- /* Images before 2026.10.3 decode config.yaml strictly and refuse a nats key: render it only for a CalVer tag from 2026.10.3 on (or a tag that is not CalVer). */}}
{{- $knowledgeTag := splitList ":" .Values.knowledge.image | last }}
{{- if and .Values.knowledge.nats.url (or (not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" $knowledgeTag)) (semverCompare ">=2026.10.3" $knowledgeTag)) }}
    nats:
      url: {{ .Values.knowledge.nats.url | quote }}
{{- end }}
  models.yaml: |
{{ toYaml .Values.knowledge.models | indent 4 }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "knowledge.fullname" . }}-migrate"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: migration
  annotations:
    # Run as a hook so each release gets a fresh Job (Job spec.template is
    # immutable, so a plain manifest can never be upgraded in place).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # before-hook-creation: delete the previous release's Job so the new one
    # can be created even if it's still around (e.g. it failed or ttl hasn't
    # expired yet). hook-succeeded: clean up after a successful migration.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: "{{ include "knowledge.fullname" . }}"
        component: migration
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: "{{ .Values.knowledge.image }}"
        imagePullPolicy: IfNotPresent
        command: ["/knowledge", "migrate"]
        # No ConfigMap mount: migrate only needs Postgres + Qdrant URL,
        # sourced entirely from this Secret — the same mechanism already
        # used successfully for PGUSER/PGPASSWORD, so this hook never
        # depends on any non-hook resource existing first. It does not read
        # models.yaml (it embeds nothing). Without config.yaml it builds the
        # collection for the image's default embedding space and dimension
        # (bge-m3, 1024), which are the values in values.yaml: if you change
        # knowledge.embeddings, create the collection yourself first.
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPASSWORD
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: QDRANT_URL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app: "{{ include "knowledge.fullname" . }}"
    component: deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
      annotations:
        # The app reads config.yaml and models.yaml at startup: a change to any
        # knowledge value restarts the pod.
        checksum/config: {{ toYaml .Values.knowledge | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: knowledge
        image: "{{ .Values.knowledge.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8300
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPASSWORD
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: QDRANT_URL
        # Optional keys: a pod starts without them, and a provider whose key is
        # empty is skipped (see values.yaml, knowledge.secrets).
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: OPENROUTER_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: ANTHROPIC_API_KEY
              optional: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/knowledge
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: "{{ include "knowledge.fullname" . }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: service
spec:
  selector:
    app: "{{ include "knowledge.fullname" . }}"
    component: deployment
  ports:
  - name: http
    port: 80
    targetPort: 8300
  type: ClusterIP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.knowledge.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "knowledge.fullname" . }}"
          port: 80
