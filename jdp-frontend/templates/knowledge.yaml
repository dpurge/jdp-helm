---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: jdp-backend-secrets
    kind: ClusterSecretStore
  target:
    name: "{{ include "knowledge.fullname" . }}"
    creationPolicy: Owner
  data:
  - secretKey: PGHOST
    remoteRef:
      key: knowledge
      property: postgres-host
  - secretKey: PGPORT
    remoteRef:
      key: knowledge
      property: postgres-port
  - secretKey: PGDATABASE
    remoteRef:
      key: knowledge
      property: postgres-database
  - secretKey: PGUSER
    remoteRef:
      key: knowledge
      property: postgres-username
  - secretKey: PGPASSWORD
    remoteRef:
      key: knowledge
      property: postgres-password
  - secretKey: QDRANT_URL
    remoteRef:
      key: knowledge
      property: qdrant-url

---
# knowledge reads qdrant.collection/searchMinScore and
# embeddings/chat/generate/translate from this mounted file, not env vars
# (see knowledge's internal/config package) — Postgres connection details
# and QDRANT_URL come from the environment instead (see the Secret above),
# so this ConfigMap is never needed by the migrate Job below and stays a
# normal, Helm-tracked resource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: configmap
data:
  config.yaml: |
    qdrant:
      collection: knowledge
      searchMinScore: 0.4
    embeddings:
      provider: ollama
      baseURL: {{ .Values.knowledge.embeddings.baseUrl | quote }}
      model: {{ .Values.knowledge.embeddings.model | quote }}
      dimension: {{ .Values.knowledge.embeddings.dimension }}
    chat:
      provider: ollama
      baseURL: {{ .Values.knowledge.chat.baseUrl | quote }}
      model: {{ .Values.knowledge.chat.model | quote }}
      numCtx: {{ .Values.knowledge.chat.numCtx }}
    generate:
      provider: ollama
      baseURL: {{ .Values.knowledge.generate.baseUrl | quote }}
      model: {{ .Values.knowledge.generate.model | quote }}
    knowledgeLanguage: English
    translate:
      provider: ollama
      baseURL: {{ .Values.knowledge.translate.baseUrl | quote }}
      model: {{ .Values.knowledge.translate.model | quote }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "knowledge.fullname" . }}-migrate"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: migration
  annotations:
    # Run as a hook so each release gets a fresh Job (Job spec.template is
    # immutable, so a plain manifest can never be upgraded in place).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # before-hook-creation: delete the previous release's Job so the new one
    # can be created even if it's still around (e.g. it failed or ttl hasn't
    # expired yet). hook-succeeded: clean up after a successful migration.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: "{{ include "knowledge.fullname" . }}"
        component: migration
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: "{{ .Values.knowledge.image }}"
        imagePullPolicy: IfNotPresent
        command: ["/knowledge", "migrate"]
        # No ConfigMap mount: migrate only needs Postgres + Qdrant URL,
        # sourced entirely from this Secret — the same mechanism already
        # used successfully for PGUSER/PGPASSWORD, so this hook never
        # depends on any non-hook resource existing first.
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPASSWORD
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: QDRANT_URL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app: "{{ include "knowledge.fullname" . }}"
    component: deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: knowledge
        image: "{{ .Values.knowledge.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8300
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: PGPASSWORD
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: "{{ include "knowledge.fullname" . }}"
              key: QDRANT_URL
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/knowledge
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: "{{ include "knowledge.fullname" . }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: service
spec:
  selector:
    app: "{{ include "knowledge.fullname" . }}"
    component: deployment
  ports:
  - name: http
    port: 80
    targetPort: 8300
  type: ClusterIP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "knowledge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "knowledge.fullname" . }}"
    component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.knowledge.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "knowledge.fullname" . }}"
          port: 80
