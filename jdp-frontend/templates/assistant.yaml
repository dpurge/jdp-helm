---
# The assistant reads one secret setting, ASSISTANT_DATABASE_URL, a PostgreSQL
# connection string that holds the password. OpenBao keeps the same five
# properties as for phraseforge (host, port, database, username, password) and
# the external-secrets template builds the string from them, with the user name
# and password URL-encoded, so a password with special characters is safe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "assistant.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: jdp-backend-secrets
    kind: ClusterSecretStore
  target:
    name: "{{ include "assistant.fullname" . }}"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ASSISTANT_DATABASE_URL: "postgres://{{ "{{ .username | urlquery }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .database }}" }}"
  data:
  - secretKey: host
    remoteRef:
      key: assistant
      property: postgres-host
  - secretKey: port
    remoteRef:
      key: assistant
      property: postgres-port
  - secretKey: database
    remoteRef:
      key: assistant
      property: postgres-database
  - secretKey: username
    remoteRef:
      key: assistant
      property: postgres-username
  - secretKey: password
    remoteRef:
      key: assistant
      property: postgres-password
{{- if .Values.assistant.secrets.openrouter_api_key }}
  - secretKey: OPENROUTER_API_KEY
    remoteRef:
      key: assistant
      property: openrouter-api-key
{{- end }}
{{- if .Values.assistant.secrets.anthropic_api_key }}
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: assistant
      property: anthropic-api-key
{{- end }}

---
# The models file: which providers and models the router may use, with tags,
# priorities and prices. Rendered from values, so it is stated explicitly here
# and checked by `assistant models validate` (the pod refuses to start on a bad
# file, naming ASSISTANT_MODELS_FILE).
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "assistant.fullname" . }}-models"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "assistant.fullname" . }}"
    component: models
data:
  models.yaml: |
{{ toYaml .Values.assistant.models | indent 4 }}

---
# The workflows tasks and conversations can run: every file of
# files/assistant-workflows/ is one key. The pod validates them at startup,
# against the tools it has, and refuses to start on a bad one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "assistant.fullname" . }}-workflows"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "assistant.fullname" . }}"
    component: workflows
data:
{{ (.Files.Glob "files/assistant-workflows/*.yaml").AsConfig | indent 2 }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "assistant.fullname" . }}-migrate"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "assistant.fullname" . }}"
    component: migration
  annotations:
    # A hook, so each release gets a fresh Job (a Job's template cannot be
    # updated in place), run before the new pods start. The schema is
    # idempotent: running it again changes nothing.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: "{{ include "assistant.fullname" . }}"
        component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: migrate
        image: "{{ .Values.assistant.image }}"
        imagePullPolicy: IfNotPresent
        command: ["/assistant", "migrate"]
        env:
        - name: ASSISTANT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: "{{ include "assistant.fullname" . }}"
              key: ASSISTANT_DATABASE_URL
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "assistant.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app: "{{ include "assistant.fullname" . }}"
    component: deployment
spec:
  replicas: 1
  # One worker runs one task at a time, app-wide: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
      annotations:
        # A changed models file or workflow restarts the pod, which reads both
        # only at startup.
        checksum/models: {{ toYaml .Values.assistant.models | sha256sum }}
        checksum/workflows: {{ (.Files.Glob "files/assistant-workflows/*.yaml").AsConfig | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: assistant
        image: "{{ .Values.assistant.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ASSISTANT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: "{{ include "assistant.fullname" . }}"
              key: ASSISTANT_DATABASE_URL
        - name: ASSISTANT_MODELS_FILE
          value: /etc/assistant/models.yaml
        - name: ASSISTANT_WORKFLOWS_DIR
          value: /etc/assistant-workflows
{{- if .Values.assistant.nats.url }}
        # Empty (assistant.nats.url) leaves the variable unset: the app never connects to NATS.
        - name: ASSISTANT_NATS_URL
          value: {{ .Values.assistant.nats.url | quote }}
{{- end }}
        # Optional keys: a pod starts without them, and a provider whose key is
        # empty is skipped (see values.yaml, assistant.secrets).
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ include "assistant.fullname" . }}"
              key: OPENROUTER_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ include "assistant.fullname" . }}"
              key: ANTHROPIC_API_KEY
              optional: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 128Mi
        volumeMounts:
        - name: models
          mountPath: /etc/assistant
          readOnly: true
        - name: workflows
          mountPath: /etc/assistant-workflows
          readOnly: true
        # Liveness does not look at the database: a database outage must not
        # make Kubernetes restart a healthy process. Readiness does.
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 6
      volumes:
      - name: models
        configMap:
          name: "{{ include "assistant.fullname" . }}-models"
      - name: workflows
        configMap:
          name: "{{ include "assistant.fullname" . }}-workflows"

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "assistant.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "assistant.fullname" . }}"
    component: service
spec:
  selector:
    app: "{{ include "assistant.fullname" . }}"
    component: deployment
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP

---
# The assistant has no authentication yet (a roadmap item): anyone who can
# reach this host can queue tasks, read results and chat. Keep the hostname on
# the internal network.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "assistant.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "assistant.fullname" . }}"
    component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.assistant.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "assistant.fullname" . }}"
          port: 80
