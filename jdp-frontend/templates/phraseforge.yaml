---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "phraseforge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: jdp-backend-secrets
    kind: ClusterSecretStore
  target:
    name: "{{ include "phraseforge.fullname" . }}"
    creationPolicy: Owner
  data:
  - secretKey: PGHOST
    remoteRef:
      key: phraseforge
      property: postgres-host
  - secretKey: PGPORT
    remoteRef:
      key: phraseforge
      property: postgres-port
  - secretKey: PGDATABASE
    remoteRef:
      key: phraseforge
      property: postgres-database
  - secretKey: PGUSER
    remoteRef:
      key: phraseforge
      property: postgres-username
  - secretKey: PGPASSWORD
    remoteRef:
      key: phraseforge
      property: postgres-password
  - secretKey: OLLAMA_API_KEY
    remoteRef:
      key: phraseforge
      property: llm-api-key

---
# phraseforge reads bindAddr/providers/transcription/translation/title/
# processText/processDialog/generateVocabulary/generateModels from
# this mounted file, not env vars (see phraseforge's internal/config
# package) — PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD/SESSION_KEY/
# OLLAMA_API_KEY all come from the environment instead, so this ConfigMap
# is never needed by the migrate Job below and stays a normal, Helm-tracked
# resource. Every purpose is templated explicitly (see values.yaml's own
# comment) so an operator edits the deployed prompt/timeout text via
# values.yaml, without a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "phraseforge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "phraseforge.fullname" . }}"
    component: configmap
data:
  config.yaml: |
    bindAddr: {{ .Values.phraseforge.bindAddr | quote }}
    providers:
      ollama:
        baseURL: {{ .Values.phraseforge.providers.ollama.baseUrl | quote }}
    transcription:
      provider: {{ .Values.phraseforge.transcription.provider | quote }}
      model: {{ .Values.phraseforge.transcription.model | quote }}
      timeoutSeconds: {{ .Values.phraseforge.transcription.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.transcription.prompt | quote }}
    translation:
      provider: {{ .Values.phraseforge.translation.provider | quote }}
      model: {{ .Values.phraseforge.translation.model | quote }}
      timeoutSeconds: {{ .Values.phraseforge.translation.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.translation.prompt | quote }}
    title:
      provider: {{ .Values.phraseforge.title.provider | quote }}
      model: {{ .Values.phraseforge.title.model | quote }}
      numCtx: {{ .Values.phraseforge.title.numCtx }}
      timeoutSeconds: {{ .Values.phraseforge.title.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.title.prompt | quote }}
    processText:
      provider: {{ .Values.phraseforge.processText.provider | quote }}
      model: {{ .Values.phraseforge.processText.model | quote }}
      numCtx: {{ .Values.phraseforge.processText.numCtx }}
      timeoutSeconds: {{ .Values.phraseforge.processText.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.processText.prompt | quote }}
    processDialog:
      provider: {{ .Values.phraseforge.processDialog.provider | quote }}
      model: {{ .Values.phraseforge.processDialog.model | quote }}
      numCtx: {{ .Values.phraseforge.processDialog.numCtx }}
      timeoutSeconds: {{ .Values.phraseforge.processDialog.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.processDialog.prompt | quote }}
    generateVocabulary:
      provider: {{ .Values.phraseforge.generateVocabulary.provider | quote }}
      model: {{ .Values.phraseforge.generateVocabulary.model | quote }}
      numCtx: {{ .Values.phraseforge.generateVocabulary.numCtx }}
      timeoutSeconds: {{ .Values.phraseforge.generateVocabulary.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.generateVocabulary.prompt | quote }}
    generateModels:
      provider: {{ .Values.phraseforge.generateModels.provider | quote }}
      model: {{ .Values.phraseforge.generateModels.model | quote }}
      numCtx: {{ .Values.phraseforge.generateModels.numCtx }}
      timeoutSeconds: {{ .Values.phraseforge.generateModels.timeoutSeconds }}
      prompt: {{ .Values.phraseforge.generateModels.prompt | quote }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "phraseforge.fullname" . }}-migrate"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "phraseforge.fullname" . }}"
    component: migration
  annotations:
    # Run as a hook so each release gets a fresh Job (Job spec.template is
    # immutable, so a plain manifest can never be upgraded in place).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # before-hook-creation: delete the previous release's Job so the new one
    # can be created even if it's still around (e.g. it failed or ttl hasn't
    # expired yet). hook-succeeded: clean up after a successful migration.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: "{{ include "phraseforge.fullname" . }}"
        component: migration
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: "{{ .Values.phraseforge.image }}"
        imagePullPolicy: IfNotPresent
        command: ["/phraseforge", "migrate"]
        # No ConfigMap mount: migrate only needs Postgres, sourced entirely
        # from this Secret — the same mechanism already used successfully
        # for PGUSER/PGPASSWORD, so this hook never depends on any
        # non-hook resource existing first.
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGPASSWORD

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "phraseforge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app: "{{ include "phraseforge.fullname" . }}"
    component: deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: phraseforge
        image: "{{ .Values.phraseforge.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8090
        env:
        - name: CONFIG_FILE
          value: /etc/phraseforge/config.yaml
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGPASSWORD
        - name: SESSION_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: PGPASSWORD
        - name: OLLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ include "phraseforge.fullname" . }}"
              key: OLLAMA_API_KEY
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/phraseforge
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: "{{ include "phraseforge.fullname" . }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "phraseforge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "phraseforge.fullname" . }}"
    component: service
spec:
  selector:
    app: "{{ include "phraseforge.fullname" . }}"
    component: deployment
  ports:
  - name: http
    port: 80
    targetPort: 8090
  type: ClusterIP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "phraseforge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "phraseforge.fullname" . }}"
    component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.phraseforge.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "phraseforge.fullname" . }}"
          port: 80
