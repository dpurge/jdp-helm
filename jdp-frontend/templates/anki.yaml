---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "anki.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "anki.fullname" . }}"
    component: pvc
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500M

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "anki.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "anki.fullname" . }}"
    component: externalsecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: "jdp-backend-secrets"
    kind: ClusterSecretStore
  dataFrom:
  - extract:
      key: anki
  target:
    name: "{{ include "anki.fullname" . }}"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SYNC_USER1: "{{ `{{ index . \"user1-name\" }}` }}:{{ `{{ index . \"user1-password\" }}` }}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "anki.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app: "{{ include "anki.fullname" . }}"
    component: deployment
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
      - name: anki
        image: "{{ .Values.anki.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: "{{ include "anki.fullname" . }}"
        volumeMounts:
        - name: "data"
          mountPath: /root
        resources:
          limits:
            memory: "2Gi"
      volumes:
      - name: "data"
        persistentVolumeClaim:
          claimName: "{{ include "anki.fullname" . }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "anki.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "anki.fullname" . }}"
    component: service
spec:
  selector:
    app: "{{ include "anki.fullname" . }}"
    component: deployment
  ports:
  - protocol: TCP
    name: http
    port: 80
    targetPort: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "anki.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "anki.fullname" . }}"
    component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.anki.hostname }}`)
      services:
        - kind: Service
          name: "{{ include "anki.fullname" . }}"
          port: 80
