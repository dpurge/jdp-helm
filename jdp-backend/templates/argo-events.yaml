---
# Argo Events controller. Vendored from the upstream namespaced install manifest
# (see argo-events-crds.yaml for the CRDs) rather than the argo-events Helm chart,
# to track the same upstream release dev pins in k8s-lab's Taskfile.
#
# The controller pod runs in this release's namespace, but --managed-namespace
# points it at .Values.workflows.namespace (where jdp-workflow's EventBus/
# EventSource/Sensor objects actually live), so the Role/RoleBinding below are
# created there instead of here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "argo-events.fullname" . }}"
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "argo-events.fullname" . }}"
  namespace: {{ .Values.workflows.namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - argoproj.io
  resources:
  - sensors
  - sensors/finalizers
  - sensors/status
  - eventsources
  - eventsources/finalizers
  - eventsources/status
  - eventbus
  - eventbus/finalizers
  - eventbus/status
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - pods/exec
  - configmaps
  - services
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - update
  - list
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "argo-events.fullname" . }}"
  namespace: {{ .Values.workflows.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "argo-events.fullname" . }}"
subjects:
- kind: ServiceAccount
  name: "{{ include "argo-events.fullname" . }}"
  namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "argo-events.fullname" . }}-controller-config"
  namespace: {{ .Release.Namespace }}
data:
  controller-config.yaml: |
    eventBus:
      nats:
        versions:
        - version: 0.22.1
          natsStreamingImage: nats-streaming:0.22.1
          metricsExporterImage: natsio/prometheus-nats-exporter:0.8.0
      jetstream:
        # Default JetStream settings, could be overridden by EventBus JetStream specs
        settings: |
          # https://docs.nats.io/running-a-nats-service/configuration#jetstream
          # Only configure "max_memory_store" or "max_file_store", do not set "store_dir" as it has been hardcoded.
          # e.g. 1G. -1 means no limit, up to 75% of available memory
          max_memory_store: -1
          # e.g. 20G. -1 means no limit, Up to 1TB if available
          max_file_store: 1TB
        streamConfig: |
          # The default properties of the streams to be created in this JetStream service
          maxMsgs: 50000
          maxAge: 168h
          maxBytes: -1
          replicas: 3
          duplicates: 300s
          # 0: Limits, 1: Interest, 2: WorkQueue
          retention: 0
          # 0: DiscardOld, 1: DiscardNew
          discard: 0
        versions:
        - version: latest
          natsImage: nats:2.10.29
          metricsExporterImage: natsio/prometheus-nats-exporter:0.14.0
          configReloaderImage: natsio/nats-server-config-reloader:0.14.0
          startCommand: /nats-server
        - version: 2.8.1
          natsImage: nats:2.8.1
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: /nats-server
        - version: 2.8.1-alpine
          natsImage: nats:2.8.1-alpine
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: nats-server
        - version: 2.8.2
          natsImage: nats:2.8.2
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: /nats-server
        - version: 2.8.2-alpine
          natsImage: nats:2.8.2-alpine
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: nats-server
        - version: 2.9.1
          natsImage: nats:2.9.1
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: /nats-server
        - version: 2.9.12
          natsImage: nats:2.9.12
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: /nats-server
        - version: 2.9.16
          natsImage: nats:2.9.16
          metricsExporterImage: natsio/prometheus-nats-exporter:0.9.1
          configReloaderImage: natsio/nats-server-config-reloader:0.7.0
          startCommand: /nats-server
        - version: 2.10.29
          natsImage: nats:2.10.29
          metricsExporterImage: natsio/prometheus-nats-exporter:0.14.0
          configReloaderImage: natsio/nats-server-config-reloader:0.14.0
          startCommand: /nats-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "argo-events.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ include "argo-events.fullname" . }}"
  template:
    metadata:
      labels:
        app: "{{ include "argo-events.fullname" . }}"
    spec:
      serviceAccountName: "{{ include "argo-events.fullname" . }}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 9731
      containers:
      - name: controller-manager
        image: "{{ .Values.argoEvents.image }}:{{ .Values.argoEvents.version }}"
        imagePullPolicy: Always
        args:
        - controller
        - --namespaced
        - --managed-namespace
        - {{ .Values.workflows.namespace }}
        env:
        - name: ARGO_EVENTS_IMAGE
          value: "{{ .Values.argoEvents.image }}:{{ .Values.argoEvents.version }}"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 3
        volumeMounts:
        - name: controller-config-volume
          mountPath: /etc/argo-events
      volumes:
      - name: controller-config-volume
        configMap:
          name: "{{ include "argo-events.fullname" . }}-controller-config"
