---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "workflows.fullname" . }}-role"
  namespace: {{ .Release.Namespace }}
rules:
  # k8s standard APIs
  - apiGroups:
      - ""
    resources:
      - events
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - eventsources
      - sensors
      - workflows
      - workfloweventbindings
      - workflowtemplates
      - clusterworkflowtemplates
      - cronworkflows
      - workflowtaskresults
    verbs:
      - create
      - delete
      - update
      - patch
      - get
      - list
      - watch

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "workflows.fullname" . }}-sa"
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "workflows.fullname" . }}-rolebinding"
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "workflows.fullname" . }}-role"
subjects:
- kind: ServiceAccount
  name: "{{ include "workflows.fullname" . }}-sa"
  namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "workflows.fullname" . }}-secret"
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: "{{ include "workflows.fullname" . }}-sa"
type: kubernetes.io/service-account-token

---
# The argo-workflows UI otherwise defaults to whatever namespace the server
# pod itself runs in ({{ .Release.Namespace }}), which has no workflows —
# they run in .Values.workflows.namespace instead. Redirecting
# just the bare root path to the namespaced URL (the same URL scheme Argo's
# own UI already uses for /workflows/<namespace>) fixes the landing page
# without touching argo-workflows' own RBAC/args — see values.yaml for why
# --managed-namespace doesn't cleanly fit this topology.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ include "workflows.fullname" . }}-default-namespace"
  namespace: {{ .Release.Namespace }}
spec:
  redirectRegex:
    regex: "^https?://[^/]+/?$"
    replacement: "http://{{ .Values.workflows.hostname }}/workflows/{{ .Values.workflows.namespace }}"
    permanent: false

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "workflows.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.workflows.hostname }}`)
      middlewares:
        - name: "{{ include "workflows.fullname" . }}-default-namespace"
      services:
        - kind: Service
          name: "{{ .Chart.Name }}-argo-workflows-server"
          port: 2746