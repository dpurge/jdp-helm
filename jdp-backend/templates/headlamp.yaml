---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Chart.Name }}-headlamp-admin"
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Chart.Name }}-headlamp-admin"
subjects:
- kind: ServiceAccount
  name: "{{ .Chart.Name }}-headlamp-admin"
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Chart.Name }}-headlamp-admin"
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: "{{ .Chart.Name }}-headlamp-admin"
type: kubernetes.io/service-account-token

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-headlamp"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Chart.Name }}-headlamp"
    component: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Chart.Name }}-headlamp"
      component: deployment
  template:
    metadata:
      labels:
        app: "{{ .Chart.Name }}-headlamp"
        component: deployment
    spec:
      serviceAccountName: "{{ .Chart.Name }}-headlamp-admin"
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: headlamp
        image: "{{ .Values.headlamp.image }}:{{ .Values.headlamp.version }}"
        args:
        - -in-cluster
        - -plugins-dir=/headlamp/plugins
        ports:
        - name: http
          containerPort: 4466
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Chart.Name }}-headlamp"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Chart.Name }}-headlamp"
    component: service
spec:
  selector:
    app: "{{ .Chart.Name }}-headlamp"
    component: deployment
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ .Chart.Name }}-headlamp"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Chart.Name }}-headlamp"
    component: ingress
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`{{ .Values.headlamp.hostname }}`)
    services:
    - kind: Service
      name: "{{ .Chart.Name }}-headlamp"
      port: 80
