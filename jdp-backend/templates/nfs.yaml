---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: nfs-subdir-external-provisioner
  name: "{{ include "nfs.fullname" . }}"

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  labels:
    app: nfs-subdir-external-provisioner
  name: nfs
  annotations:
provisioner: cluster.local/{{ include "nfs.fullname" . }}
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  archiveOnDelete: "true"

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: nfs-subdir-external-provisioner
  name: "{{ include "nfs.fullname" . }}-runner"
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs:     ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs:     ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs:     ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs:     ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs:     ["create", "update", "patch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: nfs-subdir-external-provisioner
  name: run-{{ include "nfs.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: "{{ include "nfs.fullname" . }}"
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: "{{ include "nfs.fullname" . }}-runner"
  apiGroup: rbac.authorization.k8s.io

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: nfs-subdir-external-provisioner
  name: leader-locking-{{ include "nfs.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs:     ["get", "list", "watch", "create", "update", "patch"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: nfs-subdir-external-provisioner
  name: leader-locking-{{ include "nfs.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: "{{ include "nfs.fullname" . }}"
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: leader-locking-{{ include "nfs.fullname" . }}
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "nfs.fullname" . }}"
  labels:
    app: nfs-subdir-external-provisioner
spec:
  replicas: {{ .Values.nfs.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-subdir-external-provisioner
  template:
    metadata:
      annotations:
      labels:
        app: nfs-subdir-external-provisioner
    spec:
      serviceAccountName: "{{ include "nfs.fullname" . }}"
      securityContext: {}
      containers:
        - name: nfs-subdir-external-provisioner
          image: "registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2"
          imagePullPolicy: IfNotPresent
          securityContext: {}
          volumeMounts:
            - name: nfs-subdir-external-provisioner-root
              mountPath: /persistentvolumes
          resources:
            limits:
              memory: 64Mi
          env:
            - name: PROVISIONER_NAME
              value: cluster.local/{{ include "nfs.fullname" . }}
            - name: NFS_SERVER
              value: {{ .Values.nfs.server }}
            - name: NFS_PATH
              value: {{ .Values.nfs.path }}
      volumes:
        - name: nfs-subdir-external-provisioner-root
          nfs:
            server: {{ .Values.nfs.server }}
            path: {{ .Values.nfs.path }}
