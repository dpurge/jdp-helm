---
# WorkflowTemplate used by the YouTube webhook. The scheduled CronWorkflow
# remains in youtube.yaml.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: "{{ .Chart.Name }}-youtube"
  namespace: {{ .Release.Namespace }}
spec:
  entrypoint: main
  arguments:
    parameters:
    - name: image
      value: {{ .Values.youtube.image | quote }}
    - name: workspace
      value: {{ .Values.youtube.workspace | quote }}
    - name: video
      value: {{ .Values.youtube.video | quote }}
  volumes:
  - name: workspace
    hostPath:
      path: '{{`{{workflow.parameters.workspace}}`}}'
      type: Directory
  - name: video
    hostPath:
      path: '{{`{{workflow.parameters.video}}`}}'
      type: Directory
  templates:
  - name: main
    dag:
      tasks:
      - name: download
        template: youtube-download
  - name: youtube-download
    script:
      image: '{{`{{workflow.parameters.image}}`}}'
      workingDir: /workspace
      volumeMounts:
      - mountPath: /workspace
        name: workspace
      - mountPath: /video
        name: video
      command: [sh]
      source: |
        set -e
        workspace="/workspace"
        video="/video"
        cfg="config.txt"
        for i in $(find "$workspace" -type f -name "$cfg"); do
          cd "$(dirname "$i")"
          echo "===== $i ====="
          yt-dlp --config-location "$cfg" || true
          for d in */; do
            [ "$d" = "*/" ] && continue
            mkdir -p "${video}/${PWD##*/}/${d}"
            for f in "${d}"*; do
              echo "Move: ${f}"
              mv -f "${f}" "${video}/${PWD##*/}/${f}" || continue
            done
            rmdir "${d%/}" || continue
          done
        done
