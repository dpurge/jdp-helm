---
# Workflow pod permissions in the workflow namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Values.workflows.role }}"
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflowtaskresults
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "workflows.fullname" . }}"
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.workflows.role }}
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ include "workflows.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ include "workflows.fullname" . }}"
    component: externalsecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: "jdp-backend-secrets"
    kind: ClusterSecretStore
  target:
    name: "{{ include "workflows.fullname" . }}"
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: workflows
