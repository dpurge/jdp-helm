---
# Argo Events resources for the on-demand YouTube workflow webhook.
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  jetstream:
    version: latest
    replicas: 1
    streamConfig: |
      replicas: 1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "events-workflow.fullname" . }}"
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "events-workflow.fullname" . }}"
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [argoproj.io]
  resources: [workflows]
  verbs: [create, get, list, watch, update, patch, delete]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "events-workflow.fullname" . }}"
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "events-workflow.fullname" . }}"
subjects:
- kind: ServiceAccount
  name: "{{ include "events-workflow.fullname" . }}"
  namespace: {{ .Release.Namespace }}

---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: "{{ include "webhook.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  service:
    ports:
    - port: 12000
      targetPort: 12000
  webhook:
    youtube:
      port: "12000"
      endpoint: /youtube
      method: POST

---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: "{{ include "webhook.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  template:
    serviceAccountName: "{{ include "events-workflow.fullname" . }}"
  dependencies:
  - name: youtube-webhook
    eventSourceName: "{{ include "webhook.fullname" . }}"
    eventName: youtube
  triggers:
  - template:
      name: youtube-workflow
      k8s:
        operation: create
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: "{{ include "youtube.fullname" . }}-"
              namespace: {{ .Release.Namespace }}
            spec:
              workflowTemplateRef:
                name: "{{ include "youtube.fullname" . }}"
        parameters: []

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "webhook.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.workflows.hostname }}`) && PathPrefix(`/youtube`)
      services:
        - kind: Service
          name: webhook-eventsource-svc
          port: 12000
