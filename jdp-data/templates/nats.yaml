---
kind: Service
apiVersion: v1
metadata:
  name: "{{ include "nats.fullname" . }}"
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  ports:
  - port: {{ .Values.nats.port }}

---
kind: Endpoints
apiVersion: v1
metadata:
  name: "{{ include "nats.fullname" . }}"
  namespace: {{ .Release.Namespace }}
subsets:
  - addresses:
        - ip: {{ .Values.nats.ip }}
    ports:
      - port: {{ .Values.nats.port }}
        name: "{{ include "nats.fullname" . }}"